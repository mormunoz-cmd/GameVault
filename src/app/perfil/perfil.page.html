<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/catalogo"></ion-back-button>
    </ion-buttons>
    <ion-title>Perfil de Usuario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card class="ion-text-center">
    <ion-card-header>
      <ion-card-title>{{ usuario.username }}</ion-card-title>
      <ion-card-subtitle>{{ usuario.rol }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="full">
        <ion-item>
          <ion-label>Juegos en Bóveda</ion-label>
          <ion-badge slot="end" color="primary">{{ usuario.juegosGuardados }}</ion-badge>
        </ion-item>
        <ion-item>
          <ion-label>Estado de Cuenta</ion-label>
          <ion-badge slot="end" color="success">{{ usuario.estado }}</ion-badge>
        </ion-item>
      </ion-list>

      <ion-button expand="block" color="danger" class="ion-margin-top" routerLink="/login">
        Cerrar Sesión
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
