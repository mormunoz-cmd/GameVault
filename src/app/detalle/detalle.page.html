<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/catalogo"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle del Juego</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>{{ juego.titulo }}</ion-card-title>
      <ion-card-subtitle>Plataforma: {{ juego.plataforma }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <h3>Descripción General</h3>
      <p>{{ juego.descripcion }}</p>

      <ion-item class="ion-margin-top">
        <ion-label>
          <h3>Estado en la Bóveda</h3>
          <p>Disponible para descarga y gestión.</p>
        </ion-label>
      </ion-item>

      <ion-button expand="block" color="danger" class="ion-margin-top" routerLink="/catalogo">
        Volver al Catálogo
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
