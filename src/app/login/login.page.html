<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>GameVault</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="ion-text-center ion-margin-vertical">
    <h2>Bienvenido!</h2>
  </div>

  <ion-item>
    <ion-input label="Usuario" labelPlacement="stacked" placeholder="Ingresa usuario" [(ngModel)]="usuario"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input type="password" label="Password" labelPlacement="stacked" placeholder="****" maxlength="4" [(ngModel)]="password"></ion-input>
  </ion-item>

  <div class="ion-margin-top">
    <ion-button expand="block" (click)="validarLogin()">Ingresar</ion-button>
  </div>

  <div class="ion-text-center ion-margin-top">
    <a href="#">Crea tu cuenta gratis</a>
  </div>
</ion-content>
