<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>GameVault</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="ion-margin-bottom">
    <p><strong>Usuario:</strong> {{ usuarioRecibido }}</p>
    <h2>Información Adicional</h2>
  </div>

  <ion-item class="animar-input">
    <ion-input label="Nombre" labelPlacement="stacked" placeholder="Ingrese Nombre" [(ngModel)]="nombre"></ion-input>
  </ion-item>

  <ion-item class="animar-input">
    <ion-input label="Apellido" labelPlacement="stacked" placeholder="Ingrese Apellido" [(ngModel)]="apellido"></ion-input>
  </ion-item>

  <ion-item>
    <ion-select label="Nivel Educación" labelPlacement="stacked" placeholder="Seleccione Nivel" [(ngModel)]="nivelEducacion">
      <ion-select-option value="basica">Básica</ion-select-option>
      <ion-select-option value="media">Media</ion-select-option>
      <ion-select-option value="superior">Superior</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-input type="date" label="Fecha Nacimiento" labelPlacement="stacked" [(ngModel)]="fechaNacimiento"></ion-input>
  </ion-item>

  <ion-row class="ion-margin-top">
    <ion-col>
      <ion-button expand="block" color="light" (click)="limpiarCampos()">Limpiar</ion-button>
    </ion-col>
    <ion-col>
      <ion-button expand="block" color="primary" (click)="mostrarInformacion()">Mostrar</ion-button>
    </ion-col>
  </ion-row>

  
  <div class="ion-margin-top">
    <ion-button expand="block" color="success" routerLink="/catalogo">
      Ir al Catálogo de Juegos
    </ion-button>
  </div>

  <div class="ion-text-center ion-margin-top">
    <p>App desarrollada por Morgan</p>
  </div>
</ion-content>
